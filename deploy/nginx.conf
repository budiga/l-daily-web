server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/simple-diary/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # Merge these locations into the existing HTTPS server block as well.
    # Keep the actual server's certificate paths and TLS configuration.
    location = /sw.js {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location /assets/ {
        alias /var/www/simple-diary/shared/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
